# Ruff configuration file (alternative to pyproject.toml section)

# Line length
line-length = 88

# Exclude files and directories
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "__pycache__",
    "venv",
    "env",
    ".venv",
    ".env",
    "build",
    "dist",
    "migrations",
    "alembic",  # Auto-generated database migrations
    "scripts",  # Build and utility scripts
    "examples", # Example usage code
]

# Target Python version
target-version = "py311"

# Lint configuration
[lint]
# Enable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "PERF", # flake8-perf
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # raise inside except without from
    "RUF012", # mutable class default
    # Chinese punctuation is acceptable in Chinese comments/docstrings
    "RUF001", # ambiguous characters in strings (Chinese punctuation)
    "RUF002", # ambiguous characters in docstrings (Chinese punctuation)
    "RUF003", # ambiguous characters in comments (Chinese punctuation)
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores
per-file-ignores."__init__.py" = ["F401"]
per-file-ignores."test_*.py" = ["ARG001", "ARG002"]
per-file-ignores."conftest.py" = ["F401", "ARG001"]
# FastAPI 路由:`authenticated: bool = Depends(verify_token)` 是依赖注入触发器,
# 函数体故意不读(authenticated 存在即代表"已鉴权"声明)。ARG001 是框架惯例,
# 全局压制避免每行加 noqa。
per-file-ignores."app/api/routes/*.py" = ["ARG001"]

# Ignore specific rules in specific services (intentional broad exception handling)
# 注：*_crawler*.py / scene_illustration_service.py / role_card_service.py / search_service.py
# 已随 2026-07-08 后端爬虫移除全部删除，per-file-ignores 段同步清理。
per-file-ignores."app/utils/model_validation.py" = ["BLE001"]
per-file-ignores."app/deps/auth.py" = ["BLE001"]

# Fix settings
fixable = ["ALL"]
unfixable = []